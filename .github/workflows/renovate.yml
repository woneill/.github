---
name: Renovate
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Run Renovate in dry run mode
        required: false
        type: boolean
        default: true
      repo:
        description: Repository to run Renovate on
        required: false
        type: string
      logLevel:
        description: Log level for Renovate
        required: false
        type: choice
        default: info
        options:
          - info
          - debug

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          private-key: ${{ secrets.PRIVATE_KEY }}
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        with:
          configurationFile: renovate-config.js
          token: "${{ steps.get_token.outputs.token }}"
          env-regex: "^(?:RENOVATE_\\w+|LOG_LEVEL|REPOLIST|DOCKERHUB_USERNAME|DOCKERHUB_TOKEN)$"
        env:
          RENOVATE_DRY_RUN: ${{ contains(inputs.dryRun, 'true') && 'full' || '' }}
          REPOLIST: ${{ inputs.repo != '' && inputs.repo || '' }}
          LOG_LEVEL: ${{ inputs.logLevel != '' && inputs.logLevel || 'info' }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GITHUB_TOKEN: ${{ steps.get_token.outputs.token }}
